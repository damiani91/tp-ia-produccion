[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tp-ia-produccion"
version = "0.1.0"
description = "ML Production System for Well Forecasting"
requires-python = ">=3.9"
dependencies = [
    "fastapi==0.104.1",
    "uvicorn==0.24.0",
    "pandas==2.0.3",
    "scikit-learn==1.3.2",
    "mlflow==2.10.2",
    "feast==0.30.1",
    "evidently==0.4.10",
    "apache-airflow==2.7.3",
    "ray[serve]==2.10.0",
    "pydantic==2.5.0",
    "pyyaml==6.0.1",
    "python-dotenv==1.0.0",
    "psycopg2-binary==2.9.9",
]

[project.optional-dependencies]
dev = [
    "pytest==7.4.3",
    "pytest-cov==4.1.0",
    "black==23.12.0",
    "isort==5.13.2",
    "flake8==6.1.0",
    "pre-commit==3.5.0",
]

[tool.black]
line-length = 88
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --cov=src --cov-report=html"
